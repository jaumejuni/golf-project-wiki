baseURL = 'https://tfsiswap.magnafacto.com/'
locale = 'en-US'
theme = 'hugo-book'
ignoreFiles = ['\.DS_Store$']
enableGitInfo = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 1

# sectionPagesMenu = 'main'
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = true
enableRobotsTXT = false

[languages]
  [languages.en]
    contentDir = 'content/en'
    title = 'Golf MK3 GTI TFSI Swap'
    label = 'English'
    weight = 10

  [languages.es]
    contentDir = 'content/es'
    label = 'Español'
    title = 'Swap TFSI (BWA) en un Golf MK3'
    languageCode = 'es-ES'
    weight = 20
    [languages.es.params]            
    #  disable = true

 [params]
  # Fallback social-share image for pages that don't set their own `images` front matter.
  images = ['/images/intro-engine-placement.jpg']

  # (Optional, default light) Sets color theme: light, dark or auto.
  # Theme 'auto' switches between dark and light modes based on browser/os preferences
  BookTheme = 'light'

  # (Optional, default true) Controls table of contents visibility on right side of pages.
  # Start and end levels can be controlled with markup.tableOfContents setting.
  # You can also specify this parameter per page in front matter.
  BookToC = true

  # (Optional, default docs) Specify section of content to render as menu
  # You can also set value to "*" to render all sections to menu
  BookSection = 'swap'

[services.googleAnalytics]
id = 'G-JDETYR320R'
